<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Smart Scheduler</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: #f5f7fb;
}

/* Sidebar */
.sidebar {
    width: 220px;
    height: 100vh;
    background: #1e3a8a;
    color: white;
    position: fixed;
    padding: 20px;
}

.sidebar h2 {
    margin-bottom: 30px;
}

.sidebar a {
    display: block;
    padding: 10px;
    margin: 10px 0;
    background: #3b82f6;
    border-radius: 5px;
    text-decoration: none;
    color: white;
}

/* Main */
.main {
    margin-left: 240px;
    padding: 20px;
}

/* Cards */
.cards {
    display: flex;
    gap: 20px;
}

.card {
    flex: 1;
    padding: 20px;
    border-radius: 10px;
    color: white;
}

.blue { background: #3b82f6; }
.green { background: #10b981; }
.orange { background: #f59e0b; }

/* Table */
table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 20px;
}

th, td {
    padding: 10px;
    border: 1px solid #ddd;
}

/* Sections */
.box {
    background: white;
    padding: 20px;
    margin-top: 20px;
    border-radius: 10px;
}

/* ML Result */
.result {
    background: #d1fae5;
    padding: 20px;
    border-radius: 10px;
    margin-top: 20px;
    font-size: 18px;
}
</style>
</head>

<body>

<div class="sidebar">
    <h2>⚙ Scheduler</h2>
    <a href="#">Dashboard</a>
    <a href="#">Input</a>
    <a href="#">Algorithms</a>
    <a href="#">ML Prediction</a>
</div>

<div class="main">

    <!-- Cards -->
    <div class="cards">
        <div class="card blue">
            <h3>Total Processes</h3>
            <h1>4</h1>
        </div>

        <div class="card green">
            <h3>Best Algorithm</h3>
            <h1 id="bestAlgo">-</h1>
        </div>

        <div class="card orange">
            <h3>Avg Waiting Time</h3>
            <h1 id="avgTime">-</h1>
        </div>
    </div>

    <!-- Table -->
    <div class="box">
        <h3>Input Processes</h3>
        <table>
            <tr>
                <th>ID</th><th>Arrival</th><th>Burst</th><th>Priority</th>
            </tr>
            <tr><td>P1</td><td>0</td><td>5</td><td>2</td></tr>
            <tr><td>P2</td><td>1</td><td>3</td><td>1</td></tr>
            <tr><td>P3</td><td>2</td><td>8</td><td>3</td></tr>
            <tr><td>P4</td><td>3</td><td>6</td><td>2</td></tr>
        </table>
    </div>

    <!-- Chart -->
    <div class="box">
        <h3>Algorithm Comparison</h3>
        <canvas id="chart"></canvas>
    </div>

    <!-- ML Result -->
    <div class="result" id="mlResult">
        Click Run to see result
    </div>

    <button onclick="run()">Run Scheduler</button>

</div>

<script>
function run() {

    const results = {
        "FCFS": 6.5,
        "SJF": 5.25,
        "Round Robin": 7.0,
        "Priority": 5.5
    };

    let best = Object.keys(results).reduce((a,b) =>
        results[a] < results[b] ? a : b);

    document.getElementById("bestAlgo").innerText = best;
    document.getElementById("avgTime").innerText = results[best];

    document.getElementById("mlResult").innerHTML =
        "✅ Best Algorithm: <b>" + best + "</b>";

    new Chart(document.getElementById("chart"), {
        type: 'bar',
        data: {
            labels: Object.keys(results),
            datasets: [{
                label: 'Waiting Time',
                data: Object.values(results)
            }]
        }
    });
}
</script>

</body>
</html>
